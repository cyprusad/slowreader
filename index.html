<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slow Reader - Star Wars</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(1px 1px at 20% 30%, white, transparent),
        radial-gradient(1px 1px at 40% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 60% 20%, white, transparent),
        radial-gradient(1px 1px at 80% 90%, white, transparent),
        radial-gradient(1.5px 1.5px at 10% 60%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90% 40%, white, transparent),
        radial-gradient(1px 1px at 30% 80%, white, transparent),
        radial-gradient(1px 1px at 70% 10%, white, transparent),
        radial-gradient(1.5px 1.5px at 55% 85%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 25% 45%, white, transparent),
        radial-gradient(1px 1px at 75% 55%, white, transparent),
        radial-gradient(1px 1px at 15% 75%, white, transparent),
        radial-gradient(1px 1px at 85% 25%, white, transparent);
      animation: starfieldScroll 60s linear infinite;
    }
    @keyframes starfieldScroll {
      from { transform: translate(0, 0); }
      to { transform: translate(-50%, -50%); }
    }
    #logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(300px, 60vw, 600px);
      opacity: 0;
      animation: logoFadeIn 2s ease-out 0.5s forwards, logoPulse 3s ease-in-out 2.5s infinite, logoFadeOut 1s ease-in 2.5s forwards;
    }
    @keyframes logoFadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 232, 31, 0.6)); }
      50% { filter: drop-shadow(0 0 25px rgba(255, 232, 31, 0.9)); }
    }
    @keyframes logoFadeOut {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    }
    #logo::before {
      content: '';
      display: block;
      width: 100%;
      padding-bottom: 42.8%;

      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    #crawl {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      text-align: center;
    }
    .letter {
      position: absolute;
      font-family: 'Century Gothic', 'Avant Garde', sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: #f4c542;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 100;
    }
    #controls label {
      color: #f4c542;
      font-size: 14px;
    }
    #speedSlider {
      width: 100px;
    }
    #status {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #f4c542;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="starfield"></div>
    <div id="logo"></div>
    <div id="crawl"></div>
    <div id="status">Line: <span id="lineNum">0</span> / <span id="totalLines">0</span></div>
    <div id="controls">
      <label>Speed: <input type="range" id="speedSlider" min="500" max="6000" value="2000" step="100"> <span id="speedVal">2.0s</span></label>
    </div>
  </div>

  <script type="module">
    import { prepareWithSegments, layoutWithLines } from './pretext.js';

    const TEXT = `It is a period of civil war. Rebel spaceships, striking from a hidden base, have won their first victory against the evil Galactic Empire.

During the battle, Rebel spies managed to steal secret plans to the Empire's ultimate weapon, the DEATH STAR, an armored space station with enough power to destroy an entire planet.

Pursued by the Empire's sinister agents, Princess Leia races home aboard her starship, custodian of the stolen plans that can save her people and restore freedom to the galaxy....`;

    const FONT = '38px "Century Gothic", "Avant Garde", sans-serif';
    const LINE_HEIGHT = 48;
    const LETTER_SPACING = 1;

    let revealInterval = 2000;
    let textStarted = false;

    const container = document.getElementById('crawl');
    const lineNumEl = document.getElementById('lineNum');
    const totalLinesEl = document.getElementById('totalLines');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');

    speedSlider.addEventListener('input', () => {
      revealInterval = parseInt(speedSlider.value);
      speedVal.textContent = (revealInterval / 1000).toFixed(1) + 's';
    });

    function getMaxWidth() {
      return Math.min(500, window.innerWidth * 0.5);
    }

    const prepared = prepareWithSegments(TEXT, FONT, { whiteSpace: 'pre-wrap' });
    const { lines } = layoutWithLines(prepared, getMaxWidth(), LINE_HEIGHT);
    totalLinesEl.textContent = lines.length;

    const segmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' });

    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    measureCtx.font = FONT;

    const allGraphemes = [];
    const graphemeWidths = [];
    const lineStartIndices = [];
    const lineWidths = [];
    const lineCharCounts = [];

    let currentY = 0;
    const maxWidth = getMaxWidth();
    
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      lineStartIndices.push(allGraphemes.length);
      
      const graphemes = [...segmenter.segment(line.text)];
      const charCount = graphemes.length;
      lineCharCounts.push(charCount);
      
      const lineWidth = line.width || measureCtx.measureText(line.text).width;
      lineWidths.push(lineWidth);
      
      const justifyAmount = charCount > 1 ? (maxWidth - lineWidth) / (charCount - 1) : 0;
      let currentX = 0;
      
      for (let gi = 0; gi < graphemes.length; gi++) {
        const g = graphemes[gi].segment;
        const w = measureCtx.measureText(g).width;
        
        let spacing = LETTER_SPACING;
        if (gi > 0 && justifyAmount > 0) {
          spacing += justifyAmount;
        }
        
        allGraphemes.push({
          char: g,
          lineIndex: li,
          targetX: currentX,
          width: w,
          spacing: spacing
        });
        
        graphemeWidths.push(w);
        currentX += w + spacing;
      }
      
      currentY += LINE_HEIGHT;
    }

    const els = [];
    for (let i = 0; i < allGraphemes.length; i++) {
      const g = allGraphemes[i];
      const span = document.createElement('span');
      span.className = 'letter';
      span.textContent = g.char;
      span.style.font = FONT;
      span.style.lineHeight = LINE_HEIGHT + 'px';
      span.style.display = 'none';
      container.appendChild(span);
      els.push(span);
    }

    let currentLineIndex = -1;
    let textStartTime = 0;

    function activateNextLine() {
      currentLineIndex++;
      if (currentLineIndex >= lines.length) return;
      
      const startIdx = lineStartIndices[currentLineIndex];
      const endIdx = currentLineIndex === lines.length - 1 ? allGraphemes.length : lineStartIndices[currentLineIndex + 1];
      
      for (let i = startIdx; i < endIdx; i++) {
        els[i].style.display = 'inline';
      }
      
      lineNumEl.textContent = (currentLineIndex + 1).toString();
    }

    setTimeout(() => {
      textStarted = true;
      textStartTime = performance.now();
      activateNextLine();
    }, 6000);

    function render(now) {
      if (!textStarted) {
        requestAnimationFrame(render);
        return;
      }

      const timeSinceStart = now - textStartTime;
      const crawlOffset = Math.min(timeSinceStart * 0.006, 350);
      
      const bottomY = 580;

      for (let li = 0; li <= currentLineIndex; li++) {
        const startIdx = lineStartIndices[li];
        const endIdx = li === lines.length - 1 ? allGraphemes.length : lineStartIndices[li + 1];
        
        const linesFromBottom = currentLineIndex - li;
        let y = bottomY - linesFromBottom * LINE_HEIGHT - crawlOffset;
        
        for (let i = startIdx; i < endIdx; i++) {
          const g = allGraphemes[i];
          els[i].style.display = 'inline';
          const centeredX = g.targetX - 250;
          els[i].style.transform = `translate(${centeredX}px, ${y}px)`;
        }
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    setInterval(() => {
      if (textStarted && currentLineIndex < lines.length - 1) {
        activateNextLine();
      }
    }, revealInterval);

    window.addEventListener('resize', () => {
      const newPrepared = prepareWithSegments(TEXT, FONT, { whiteSpace: 'pre-wrap' });
      const newLines = layoutWithLines(newPrepared, getMaxWidth(), LINE_HEIGHT).lines;
      
      let x = 0;
      for (let i = 0; i < allGraphemes.length; i++) {
        allGraphemes[i].targetX = x;
        x += graphemeWidths[i] + LETTER_SPACING;
        
        if (i < allGraphemes.length - 1 && allGraphemes[i+1].lineIndex !== allGraphemes[i].lineIndex) {
          x = 0;
        }
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slow Reader - Star Wars</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(1px 1px at 20% 30%, white, transparent),
        radial-gradient(1px 1px at 40% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 60% 20%, white, transparent),
        radial-gradient(1px 1px at 80% 90%, white, transparent),
        radial-gradient(1.5px 1.5px at 10% 60%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90% 40%, white, transparent),
        radial-gradient(1px 1px at 30% 80%, white, transparent),
        radial-gradient(1px 1px at 70% 10%, white, transparent),
        radial-gradient(1.5px 1.5px at 55% 85%, rgba(255,255,255,0.8), transparent);
    }
    #logo {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Century Gothic', 'Avant Garde', sans-serif;
      font-size: clamp(32px, 8vw, 64px);
      font-weight: bold;
      color: #ff6b00;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      text-shadow: 0 0 10px rgba(255, 107, 0, 0.8), 0 0 30px rgba(255, 107, 0, 0.5);
      opacity: 0;
      animation: logoFadeIn 2s ease-out 0.5s forwards;
    }
    @keyframes logoFadeIn {
      from { opacity: 0; transform: translateX(-50%) scale(0.8); }
      to { opacity: 1; transform: translateX(-50%) scale(1); }
    }
    #crawl {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 800px;
      will-change: transform;
    }
    .letter {
      position: absolute;
      will-change: transform;
      font-family: 'Century Gothic', 'Avant Garde', sans-serif;
      font-size: 28px;
      font-weight: 500;
      color: #f4c542;
      text-shadow: 0 0 5px rgba(244, 197, 66, 0.6);
    }
    .letter.locked {
      text-shadow: 0 0 8px rgba(244, 197, 66, 0.9);
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 100;
    }
    #controls label {
      color: #f4c542;
      font-size: 14px;
    }
    #speedSlider {
      width: 100px;
    }
    #status {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #f4c542;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="starfield"></div>
    <div id="logo">STAR WARS</div>
    <div id="crawl"></div>
    <div id="status">Line: <span id="lineNum">0</span> / <span id="totalLines">0</span></div>
    <div id="controls">
      <label>Speed: <input type="range" id="speedSlider" min="200" max="3000" value="1000" step="100"> <span id="speedVal">1.0s</span></label>
    </div>
  </div>

  <script type="module">
    import { prepareWithSegments, layoutWithLines } from './pretext.js';

    const TEXT = `A long time ago in a galaxy far, far away....

STAR WARS

It is a period of civil war. Rebel spaceships, striking from a hidden base, have won their first victory against the evil Galactic Empire.

During the battle, Rebel spies managed to steal secret plans to the Empire's ultimate weapon, the DEATH STAR, an armored space station with enough power to destroy an entire planet.

Pursued by the Empire's sinister agents, Princess Leia races home aboard her starship, custodian of the stolen plans that can save her people and restore freedom to the galaxy....`;

    const FONT = '28px "Century Gothic", "Avant Garde", sans-serif';
    const FONT_SIZE = 28;
    const LINE_HEIGHT = 38;
    const LETTER_SPACING = 1;

    let revealInterval = 1000;
    let crawlY = 0;

    const container = document.getElementById('crawl');
    const lineNumEl = document.getElementById('lineNum');
    const totalLinesEl = document.getElementById('totalLines');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');

    speedSlider.addEventListener('input', () => {
      revealInterval = parseInt(speedSlider.value);
      speedVal.textContent = (revealInterval / 1000).toFixed(1) + 's';
    });

    function getMaxWidth() {
      return Math.min(800, window.innerWidth * 0.8);
    }

    const prepared = prepareWithSegments(TEXT, FONT, { whiteSpace: 'pre-wrap' });
    const { lines } = layoutWithLines(prepared, getMaxWidth(), LINE_HEIGHT);
    totalLinesEl.textContent = lines.length;

    const segmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' });

    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    measureCtx.font = FONT;

    const allGraphemes = [];
    const graphemeWidths = [];
    const lineStartIndices = [];

    let currentY = 0;
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      lineStartIndices.push(allGraphemes.length);
      
      const graphemes = [...segmenter.segment(line.text)];
      let currentX = 0;
      
      for (let gi = 0; gi < graphemes.length; gi++) {
        const g = graphemes[gi].segment;
        const w = measureCtx.measureText(g).width;
        
        allGraphemes.push({
          char: g,
          lineIndex: li,
          targetX: currentX,
          targetY: currentY,
          width: w,
          x: currentX + (Math.random() - 0.5) * 400,
          y: 600 + Math.random() * 400,
          px: 0,
          py: 0,
          locked: false,
          hasEntered: false
        });
        
        graphemeWidths.push(w);
        currentX += w + LETTER_SPACING;
      }
      
      currentY += LINE_HEIGHT;
    }

    const totalHeight = currentY;
    const els = [];
    for (let i = 0; i < allGraphemes.length; i++) {
      const g = allGraphemes[i];
      const span = document.createElement('span');
      span.className = 'letter';
      span.textContent = g.char;
      span.style.font = FONT;
      span.style.lineHeight = LINE_HEIGHT + 'px';
      container.appendChild(span);
      els.push(span);
      
      g.px = g.x;
      g.py = g.y;
    }

    const lineActivationOrder = [];
    for (let li = lines.length - 1; li >= 0; li--) {
      lineActivationOrder.push(li);
    }

    let currentLineIndex = 0;

    function activateLine(lineIndex) {
      const startIdx = lineStartIndices[lineIndex];
      const endIdx = lineIndex === lines.length - 1 ? allGraphemes.length : lineStartIndices[lineIndex + 1];
      
      for (let i = startIdx; i < endIdx; i++) {
        const g = allGraphemes[i];
        if (!g.hasEntered) {
          g.x = g.targetX + (Math.random() - 0.5) * 300;
          g.y = 500 + Math.random() * 300;
          g.px = g.x;
          g.py = g.y;
          g.hasEntered = true;
        }
        g.locked = true;
        els[i].classList.add('locked');
      }
    }

    activateLine(lineActivationOrder[0]);
    lineNumEl.textContent = '1';

    function revealNextLine() {
      currentLineIndex++;
      if (currentLineIndex < lineActivationOrder.length) {
        activateLine(lineActivationOrder[currentLineIndex]);
        lineNumEl.textContent = (currentLineIndex + 1).toString();
      }
    }

    setInterval(revealNextLine, revealInterval);

    const DAMPING = 0.88;
    const GRAVITY = 0.15;
    const ITERATIONS = 8;
    const BOUNCE = 0.4;

    function simulate() {
      for (let i = 0; i < allGraphemes.length; i++) {
        const g = allGraphemes[i];
        if (g.locked || !g.hasEntered) continue;
        
        const vx = (g.x - g.px) * DAMPING;
        const vy = (g.y - g.py) * DAMPING;
        
        g.px = g.x;
        g.py = g.y;
        
        g.x += vx;
        g.y += vy + GRAVITY;
      }

      for (let iter = 0; iter < ITERATIONS; iter++) {
        for (let i = 0; i < allGraphemes.length - 1; i++) {
          const a = allGraphemes[i];
          const b = allGraphemes[i + 1];
          
          if ((a.locked || !a.hasEntered) && (b.locked || !b.hasEntered)) continue;
          
          if (a.lineIndex === b.lineIndex) {
            const restLength = a.width + LETTER_SPACING;
            const ax = a.x + a.width / 2;
            const ay = a.y + LINE_HEIGHT / 2;
            const bx = b.x + b.width / 2;
            const by = b.y + LINE_HEIGHT / 2;
            
            const dx = bx - ax;
            const dy = by - ay;
            const dist = Math.hypot(dx, dy) || 0.001;
            const diff = (dist - restLength) / dist;
            
            if (a.locked && a.hasEntered && (!b.locked || !b.hasEntered)) {
              b.x -= dx * diff;
              b.y -= dy * diff;
            } else if ((!a.locked || !a.hasEntered) && b.locked && b.hasEntered) {
              a.x += dx * diff;
              a.y += dy * diff;
            } else if ((!a.locked || !a.hasEntered) && (!b.locked || !b.hasEntered)) {
              a.x += dx * diff * 0.5;
              a.y += dy * diff * 0.5;
              b.x -= dx * diff * 0.5;
              b.y -= dy * diff * 0.5;
            }
          }
        }
      }

      const RADIUS = 10;
      for (let i = 0; i < allGraphemes.length; i++) {
        if (allGraphemes[i].locked || !allGraphemes[i].hasEntered) continue;
        const a = allGraphemes[i];
        
        for (let j = i + 1; j < allGraphemes.length; j++) {
          if (allGraphemes[j].locked || !allGraphemes[j].hasEntered) continue;
          if (Math.abs(i - j) < 2) continue;
          
          const b = allGraphemes[j];
          const dx = (b.x + b.width / 2) - (a.x + a.width / 2);
          const dy = (b.y + LINE_HEIGHT / 2) - (a.y + LINE_HEIGHT / 2);
          const dist = Math.hypot(dx, dy) || 0.001;
          const minDist = RADIUS * 2;
          
          if (dist < minDist) {
            const overlap = (minDist - dist) / dist * 0.3;
            a.x -= dx * overlap;
            a.y -= dy * overlap;
            b.x += dx * overlap;
            b.y += dy * overlap;
          }
        }
      }

      const maxX = getMaxWidth();
      for (let i = 0; i < allGraphemes.length; i++) {
        const g = allGraphemes[i];
        if (g.locked || !g.hasEntered) continue;
        
        if (g.x < 0) { g.x = 0; g.px = g.x + (g.x - g.px) * BOUNCE; }
        if (g.x + g.width > maxX) { g.x = maxX - g.width; g.px = g.x + (g.x - g.px) * BOUNCE; }
        if (g.y > 700) { g.y = 700; g.py = g.y + (g.y - g.py) * BOUNCE; }
        if (g.y < -100) { g.y = -100; g.py = g.y + (g.y - g.py) * BOUNCE; }
      }
    }

    let lastTime = -1;
    const FIXED_DT = 1 / 120;
    let accumulator = 0;
    let startTime = performance.now();

    function render(now) {
      if (lastTime < 0) { lastTime = now; }
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      accumulator += dt;

      while (accumulator >= FIXED_DT) {
        simulate();
        accumulator -= FIXED_DT;
      }

      crawlY = -totalHeight + (now - startTime) * 0.02;
      if (crawlY > 0) crawlY = 0;
      container.style.transform = `translateX(-50%) translateY(${crawlY}px)`;

      for (let i = 0; i < allGraphemes.length; i++) {
        const g = allGraphemes[i];
        const el = els[i];
        
        if (!g.locked && g.hasEntered) {
          el.classList.remove('locked');
        }
        
        el.style.transform = `translate(${g.x}px, ${g.y}px)`;
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    window.addEventListener('resize', () => {
      const newPrepared = prepareWithSegments(TEXT, FONT, { whiteSpace: 'pre-wrap' });
      const { lines: newLines } = layoutWithLines(newPrepared, getMaxWidth(), LINE_HEIGHT);
      
      currentY = 0;
      for (let li = 0; li < newLines.length; li++) {
        const line = newLines[li];
        lineStartIndices[li] = lineStartIndices[li] || 0;
        
        const startIdx = lineStartIndices[li];
        const endIdx = li === newLines.length - 1 ? allGraphemes.length : lineStartIndices[li + 1] || startIdx;
        
        const graphemes = [...segmenter.segment(line.text)];
        let currentX = 0;
        
        for (let gi = 0; gi < graphemes.length && startIdx + gi < allGraphemes.length; gi++) {
          const g = allGraphemes[startIdx + gi];
          g.targetX = currentX;
          g.targetY = currentY;
          currentX += graphemeWidths[startIdx + gi] + LETTER_SPACING;
        }
        
        currentY += LINE_HEIGHT;
      }
    });
  </script>
</body>
</html>
